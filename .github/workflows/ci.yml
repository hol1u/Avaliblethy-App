name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-dependency-path: app/pubspec.lock
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
