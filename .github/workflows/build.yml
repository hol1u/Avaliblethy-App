name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact-path: app/build/app/outputs/flutter-apk/app-release.apk
          - platform: windows
            os: windows-latest
            command: flutter build windows --release
            artifact-path: app/build/windows/x64/runner/Release
          - platform: macos
            os: macos-latest
            command: flutter build macos --release
            artifact-path: app/build/macos/Build/Products/Release/*.app
          - platform: ios
            os: macos-latest
            command: flutter build ios --release --no-codesign
            artifact-path: app/build/ios/iphoneos/Runner.app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-dependency-path: app/pubspec.lock
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: avaliblethy-${{ matrix.platform }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
